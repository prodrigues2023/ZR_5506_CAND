version: "3.3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7777:7777"
    environment:
      SERIES_ENVIRONMENT: ${SERIES_ENVIRONMENT:-production}
      SERIES_DATABASE_URL: ${SERIES_DATABASE_URL:?Set SERIES_DATABASE_URL in .env}
      SERIES_TVMAZE_BASE_URL: ${SERIES_TVMAZE_BASE_URL:-http://api.tvmaze.com}
      SERIES_HUGGINGFACE_MODEL: ${SERIES_HUGGINGFACE_MODEL:-google/flan-t5-base}
      SERIES_HUGGINGFACE_API_URL: ${SERIES_HUGGINGFACE_API_URL:-https://api-inference.huggingface.co/models}
      SERIES_HUGGINGFACE_API_KEY: ${SERIES_HUGGINGFACE_API_KEY:-}
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-v18:/var/lib/postgresql

volumes:
  postgres-data-v18:
